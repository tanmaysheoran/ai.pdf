document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>/* ════════════════════════════════════════════════════════════════\n   ai.pdf — terminal landing (production)\n   The whole site is one terminal session. Three themes, live REPL.\n   ════════════════════════════════════════════════════════════════ */\n\n/* ── themes ───────────────────────────────────────────────────── */\n:root,\n[data-theme=\"graphite\"]{\n  --desk:#070809; --bg:#0b0d10; --panel:#0e1116; --bar:#0f1318; --bar2:#131820;\n  --line:rgba(222,228,238,.08); --line2:rgba(222,228,238,.14);\n  --fg:#e2e6ee; --dim:#828a98; --faint:#525a68;\n  --green:#6cb6ff; --cyan:#74d68f; --amber:#e7b25a; --mag:#d3a8ff; --red:#f4736b; --blue:#86a9ff;\n  --prompt:#6cb6ff; --sel:rgba(108,182,255,.26);\n  --glow:0 0 0 transparent; --scan:0;\n  --shadow:0 40px 90px -20px rgba(0,0,0,.7), 0 0 0 1px var(--line);\n}\n[data-theme=\"amber\"]{\n  --desk:#070502; --bg:#0d0a05; --panel:#120d06; --bar:#140f07; --bar2:#1b1409;\n  --line:rgba(255,193,110,.12); --line2:rgba(255,193,110,.2);\n  --fg:#ffcf85; --dim:#b88f4e; --faint:#7d5f2f;\n  --green:#ffe0a0; --cyan:#f0c074; --amber:#ffcf7a; --mag:#ffc06b; --red:#ff9c66; --blue:#f5cd86;\n  --prompt:#ffd98f; --sel:rgba(255,200,110,.22);\n  --glow:0 0 7px rgba(255,180,80,.35); --scan:.5;\n  --shadow:0 40px 90px -20px rgba(0,0,0,.8), 0 0 0 1px var(--line), 0 0 80px rgba(255,150,40,.07);\n}\n[data-theme=\"light\"]{\n  --desk:#dcd8cc; --bg:#f5f2ea; --panel:#faf7ef; --bar:#ece8dc; --bar2:#e3dece;\n  --line:rgba(28,26,20,.12); --line2:rgba(28,26,20,.2);\n  --fg:#201d16; --dim:#6a6457; --faint:#9b9484;\n  --green:#2160c4; --cyan:#2f8f56; --amber:#9a6b16; --mag:#7d3fb3; --red:#c0392b; --blue:#2f8f56;\n  --prompt:#2160c4; --sel:rgba(33,96,196,.16);\n  --glow:0 0 0 transparent; --scan:0;\n  --shadow:0 30px 70px -24px rgba(40,36,26,.4), 0 0 0 1px var(--line);\n}\n\n*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }\nhtml{ scroll-behavior:smooth; }\nbody{\n  font-family:'IBM Plex Mono', ui-monospace, 'JetBrains Mono', monospace;\n  background:\n    radial-gradient(ellipse 90% 70% at 50% -10%, color-mix(in srgb, var(--bg) 70%, transparent), transparent 70%),\n    var(--desk);\n  color:var(--fg); line-height:1.7; font-size:14px;\n  -webkit-font-smoothing:antialiased;\n  min-height:100vh;\n  padding:clamp(0px,3vw,40px) clamp(0px,3vw,40px) 0;\n  transition:background .35s, color .35s;\n}\n::selection{ background:var(--sel); }\na{ color:inherit; text-decoration:none; }\nbutton{ cursor:pointer; border:none; background:none; font-family:inherit; color:inherit; }\n.mono{ font-variant-ligatures:none; }\n\n/* ── window shell ─────────────────────────────────────────────── */\n.term{\n  max-width:1080px; margin:0 auto;\n  background:linear-gradient(180deg, color-mix(in srgb,var(--panel) 100%, transparent), var(--bg));\n  border-radius:clamp(0px,1.4vw,14px) clamp(0px,1.4vw,14px) 0 0;\n  box-shadow:var(--shadow);\n  position:relative; overflow:visible;\n  min-height:calc(100vh - clamp(0px,3vw,40px));\n}\n\n/* title bar */\n.titlebar{\n  position:sticky; top:clamp(0px,3vw,40px); z-index:30;\n  display:flex; align-items:center; gap:14px;\n  padding:0 16px; height:46px;\n  background:color-mix(in srgb, var(--bar) 86%, transparent);\n  backdrop-filter:blur(14px) saturate(140%);\n  -webkit-backdrop-filter:blur(14px) saturate(140%);\n  border-bottom:1px solid var(--line);\n  border-radius:inherit; border-bottom-left-radius:0; border-bottom-right-radius:0;\n}\n.lights{ display:flex; gap:8px; }\n.lights i{ width:12px; height:12px; border-radius:50%; display:block; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35); }\n.lights .r{ background:#ff5f57; } .lights .y{ background:#febc2e; } .lights .g{ background:#28c840; }\n.tt{ display:flex; align-items:center; gap:8px; margin:0 auto; color:var(--dim); font-size:12px; letter-spacing:.02em; }\n.tt .ic{ color:var(--faint); }\n.tt b{ color:var(--fg); font-weight:500; }\n.tbtns{ display:flex; align-items:center; gap:4px; }\n.tbtn{ display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:7px; font-size:11.5px; color:var(--dim); transition:.14s; }\n.tbtn:hover{ color:var(--fg); background:color-mix(in srgb,var(--fg) 8%, transparent); }\n.tbtn.ghub{ color:var(--fg); border:1px solid var(--line2); }\n\n/* scanline + grain overlay */\n.term::after{\n  content:''; position:absolute; inset:0; pointer-events:none; z-index:25; border-radius:inherit;\n  background:repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 1px, transparent 1px 3px);\n  mix-blend-mode:overlay; opacity:var(--scan); transition:opacity .35s;\n}\n\n/* ── jump rail ────────────────────────────────────────────────── */\n.rail{\n  position:fixed; left:max(16px, calc(50% - 540px - 132px)); top:140px; z-index:20;\n  display:flex; flex-direction:column; gap:2px; width:118px;\n}\n.rail .rl-h{ font-size:10px; letter-spacing:.18em; color:var(--faint); text-transform:uppercase; padding:0 0 8px 12px; }\n.rail a{\n  font-size:12px; color:var(--dim); padding:5px 12px;\n  border-left:2px solid var(--line2); transition:.14s; display:flex; gap:8px; align-items:center;\n}\n.rail a .n{ color:var(--faint); font-size:11px; }\n.rail a:hover{ color:var(--fg); border-color:var(--dim); }\n.rail a.on{ color:var(--green); border-color:var(--green); }\n.rail a.on .n{ color:var(--green); }\n@media(max-width:1320px){ .rail{ display:none; } }\n\n/* ── session body ─────────────────────────────────────────────── */\n.session{ padding:30px clamp(18px,3.4vw,46px) 120px; font-size:13.5px; }\n\n/* command group */\n.grp{ margin:0 0 30px; opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease; scroll-margin-top:96px; }\n.grp.in{ opacity:1; transform:none; }\n.no-anim .grp{ opacity:1; transform:none; }\n\n/* prompt line */\n.cmd{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:6px; }\n.pr{ color:var(--prompt); font-weight:600; text-shadow:var(--glow); }\n.cwd{ color:var(--cyan); }\n.gitb{ color:var(--mag); }\n.typed{ color:var(--fg); white-space:pre; }\n.flag{ color:var(--amber); }\n.arg{ color:var(--fg); }\n.caret{ display:inline-block; width:8px; height:1.05em; background:var(--prompt); transform:translateY(2px); margin-left:2px; box-shadow:var(--glow); animation:blink 1.1s step-end infinite; }\n@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0} }\n\n/* output */\n.out{ color:var(--dim); padding-left:2px; }\n.out .ok{ color:var(--green); } .out .warn{ color:var(--amber); } .out .err{ color:var(--red); }\n.out .cy{ color:var(--cyan); } .out .mg{ color:var(--mag); } .out .gr{ color:var(--green); }\n.out .fg{ color:var(--fg); } .out .dm{ color:var(--faint); }\n.cmt{ color:var(--faint); font-style:italic; }\n.indent{ padding-left:18px; }\n\n/* banner */\n.banner{ margin:6px 0 26px; }\n.wordmark{ font-family:'Space Mono', monospace; font-weight:700; font-size:clamp(46px,9vw,104px); line-height:.92; letter-spacing:-.04em; color:var(--fg); text-shadow:var(--glow); }\n.wordmark .dot{ color:var(--green); }\n.wordmark .cur{ display:inline-block; width:.5ch; height:.82em; background:var(--green); margin-left:.06em; transform:translateY(.06em); box-shadow:var(--glow); animation:blink 1.1s step-end infinite; }\n.bsub{ margin-top:14px; color:var(--dim); font-size:14px; max-width:62ch; }\n.bsub .hl{ color:var(--fg); }\n.brule{ margin:18px 0 4px; color:var(--faint); white-space:pre; overflow:hidden; font-size:13px; }\n.btags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; }\n.tag{ font-size:11.5px; color:var(--dim); border:1px solid var(--line2); border-radius:6px; padding:4px 10px; }\n.tag b{ color:var(--green); font-weight:600; }\n\n/* progress bar (build) */\n.bar-prog{ display:flex; align-items:center; gap:12px; margin:4px 0; }\n.bar-track{ flex:1; max-width:280px; height:8px; border-radius:6px; background:var(--bar2); border:1px solid var(--line); overflow:hidden; }\n.bar-fill{ height:100%; width:0; background:var(--green); box-shadow:var(--glow); transition:width 1s cubic-bezier(.2,.8,.2,1); border-radius:6px; }\n.grp.in .bar-fill{ width:100%; }\n.bar-pct{ color:var(--green); font-size:12px; min-width:42px; }\n\n/* tree (inspect) */\n.tree{ line-height:1.85; }\n.tree .br{ color:var(--faint); }\n.tree .node{ color:var(--mag); } .tree .desc{ color:var(--dim); }\n\n/* result card row (inspect summary, output files) */\n.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }\n.chip{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); background:var(--bar2); border:1px solid var(--line); border-radius:7px; padding:7px 12px; }\n.chip b{ color:var(--fg); }\n.chip .dotg{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:var(--glow); }\n\n/* diff (why) */\n.diff{ border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-top:6px; }\n.diff .hdr{ padding:8px 14px; font-size:11.5px; color:var(--dim); background:var(--bar2); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }\n.diff .row{ padding:5px 14px; font-size:12.5px; white-space:pre-wrap; }\n.diff .del{ background:color-mix(in srgb,var(--red) 12%, transparent); color:color-mix(in srgb,var(--red) 92%, var(--fg)); }\n.diff .add{ background:color-mix(in srgb,var(--green) 12%, transparent); color:color-mix(in srgb,var(--green) 92%, var(--fg)); }\n.diff .sign{ display:inline-block; width:14px; color:var(--faint); }\n\n/* sdk tabs */\n.sdk{ border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px; }\n.sdk-tabs{ display:flex; gap:0; background:var(--bar2); border-bottom:1px solid var(--line); }\n.sdk-tab{ padding:10px 18px; font-size:12.5px; color:var(--dim); border-right:1px solid var(--line); display:flex; align-items:center; gap:8px; transition:.14s; }\n.sdk-tab .glyph{ color:var(--faint); }\n.sdk-tab:hover{ color:var(--fg); }\n.sdk-tab.on{ color:var(--fg); background:var(--panel); box-shadow:inset 0 -2px 0 var(--green); }\n.sdk-tab.on .glyph{ color:var(--green); }\n.sdk-pane{ display:none; padding:18px 20px; font-size:13px; line-height:1.85; white-space:pre-wrap; }\n.sdk-pane.on{ display:block; }\n.k{ color:var(--mag); } .s{ color:var(--green); } .f{ color:var(--cyan); } .c{ color:var(--faint); font-style:italic; } .p{ color:var(--amber); }\n\n/* install row */\n.install{ display:flex; align-items:stretch; border:1px solid var(--line2); border-radius:9px; overflow:hidden; margin-top:6px; max-width:660px; background:var(--bar2); }\n\n/* format rows / key-value lists */\n.frow{ display:flex; gap:14px; padding:3px 0; align-items:baseline; }\n.frow .fl{ flex-shrink:0; min-width:128px; color:var(--cyan); }\n.frow .fl.amb{ color:var(--amber); } .frow .fl.mg{ color:var(--mag); }\n.frow .fd{ color:var(--dim); } .frow .fd b{ color:var(--fg); font-weight:500; }\n.subhead{ color:var(--faint); font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin:10px 0 4px; }\n.cols2{ display:grid; grid-template-columns:1fr 1fr; gap:2px 30px; }\n@media(max-width:680px){ .cols2{ grid-template-columns:1fr; } .frow .fl{ min-width:92px; } }\n/* callout */\n.note{ border-left:2px solid var(--amber); padding:3px 0 3px 14px; margin:10px 0 2px; }\n.note .nt{ color:var(--amber); font-weight:600; }\n.note .nb{ color:var(--dim); display:block; }\n.note .nb .fg{ color:var(--fg); }\n.install .lead{ display:flex; align-items:center; padding:0 14px; color:var(--prompt); font-weight:600; border-right:1px solid var(--line); }\n.install .cmdtext{ flex:1; display:flex; align-items:center; padding:13px 14px; color:var(--fg); overflow-x:auto; white-space:nowrap; }\n.install .cmdtext .dm{ color:var(--faint); }\n.install .copy{ display:flex; align-items:center; gap:7px; padding:0 16px; border-left:1px solid var(--line); color:var(--dim); font-size:12px; transition:.14s; }\n.install .copy:hover{ color:var(--green); background:color-mix(in srgb,var(--green) 10%, transparent); }\n.install .copy.done{ color:var(--green); }\n\n/* ── live prompt / REPL ───────────────────────────────────────── */\n#liveout > .grp{ margin-bottom:18px; }\n.repl{ display:flex; align-items:baseline; gap:8px; margin-top:10px; scroll-margin-top:120px; }\n.repl .pr{ flex-shrink:0; }\n.repl .cwd{ flex-shrink:0; }\n.repl-input{\n  flex:1; min-width:60px; background:none; border:none; outline:none;\n  color:var(--fg); font-family:inherit; font-size:13.5px; caret-color:var(--prompt);\n  padding:0;\n}\n.repl-input::placeholder{ color:var(--faint); }\n.hintline{ color:var(--faint); font-size:12px; margin-top:8px; }\n.hintline b{ color:var(--green); }\n.hintline .kbd{ border:1px solid var(--line2); border-radius:4px; padding:1px 6px; color:var(--dim); }\n\n/* ── status bar ───────────────────────────────────────────────── */\n.statusbar{\n  position:fixed; left:0; right:0; bottom:0; z-index:40;\n  display:flex; align-items:center; gap:0;\n  height:30px; font-size:11.5px;\n  background:var(--bar); border-top:1px solid var(--line2);\n  backdrop-filter:blur(10px);\n}\n.statusbar .seg{ display:flex; align-items:center; gap:7px; padding:0 12px; height:100%; color:var(--dim); border-right:1px solid var(--line); white-space:nowrap; }\n.statusbar .seg.mode{ background:var(--green); color:#05210f; font-weight:600; }\n[data-theme=\"light\"] .statusbar .seg.mode{ color:#04240f; }\n.statusbar .seg.mode .dotp{ width:7px; height:7px; border-radius:50%; background:currentColor; animation:blink 1.6s ease-in-out infinite; }\n.statusbar .grow{ flex:1; border:none; }\n.statusbar .seg.right{ border-right:none; border-left:1px solid var(--line); }\n.statusbar b{ color:var(--fg); font-weight:500; }\n.swatches{ display:flex; gap:6px; align-items:center; }\n.sw{ width:13px; height:13px; border-radius:50%; border:1px solid var(--line2); }\n.sw.on{ box-shadow:0 0 0 2px var(--green); }\n.sw.graphite{ background:#74d68f; } .sw.amber{ background:#ffcf7a; } .sw.light{ background:#e9e4d6; }\n@media(max-width:760px){ .statusbar .hideSm{ display:none; } }\n\n/* responsive */\n@media(max-width:600px){\n  body{ padding:0; }\n  .term{ border-radius:0; min-height:100vh; }\n  .titlebar{ top:0; }\n  .session{ padding:24px 16px 120px; }\n  .tt{ font-size:11px; }\n  .tbtn span.lbl{ display:none; }\n}\n\n/* reduced motion */\n@media(prefers-reduced-motion:reduce){\n  .grp{ opacity:1 !important; transform:none !important; }\n  .caret,.wordmark .cur,.statusbar .seg.mode .dotp{ animation:none; }\n}\n</style>\n</head>\n<body class=\"no-anim\">\n\n\n\n<main class=\"term\" id=\"term\">\n\n  <!-- ── title bar ─────────────────────────────────────────────── -->\n  <header class=\"titlebar\">\n    <div class=\"lights\" aria-hidden=\"true\"><i class=\"r\"></i><i class=\"y\"></i><i class=\"g\"></i></div>\n    <div class=\"tt\">\n      <span class=\"ic\">❯_</span> <b>aipdf</b> — zsh — <span>~/research</span>\n    </div>\n    <div class=\"tbtns\">\n      <button class=\"tbtn\" id=\"themeBtn\" aria-label=\"Cycle theme\" title=\"Cycle theme (graphite / amber / light)\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"></path></svg>\n        <span class=\"lbl\">theme</span>\n      </button>\n      <a class=\"tbtn ghub\" href=\"https://github.com/tanmaysheoran/ai.pdf\" target=\"_blank\" rel=\"noopener\" aria-label=\"GitHub\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z\"></path></svg>\n        <span class=\"lbl\">GitHub</span>\n      </a>\n    </div>\n  </header>\n\n  <!-- ── jump rail ─────────────────────────────────────────────── -->\n  <nav class=\"rail\" aria-label=\"Session index\">\n    <div class=\"rl-h\">session</div>\n    <a href=\"#g-what\"><span class=\"n\">01</span> what</a>\n    <a href=\"#g-install\"><span class=\"n\">02</span> install</a>\n    <a href=\"#g-build\"><span class=\"n\">03</span> build</a>\n    <a href=\"#g-inspect\"><span class=\"n\">04</span> inspect</a>\n    <a href=\"#g-formats\"><span class=\"n\">05</span> formats</a>\n    <a href=\"#g-why\"><span class=\"n\">06</span> why</a>\n    <a href=\"#g-sdk\"><span class=\"n\">07</span> sdk</a>\n    <a href=\"#g-mcp\"><span class=\"n\">08</span> mcp</a>\n    <a href=\"#g-security\"><span class=\"n\">09</span> security</a>\n    <a href=\"#g-try\"><span class=\"n\">10</span> try it</a>\n  </nav>\n\n  <!-- ── session ───────────────────────────────────────────────── -->\n  <div class=\"session\" id=\"session\">\n\n    <!-- banner -->\n    <div class=\"grp\" id=\"g-top\">\n      <div class=\"banner\">\n        <div class=\"wordmark\">ai<span class=\"dot\">.</span>pdf<span class=\"cur\"></span></div>\n        <p class=\"bsub\">An <span class=\"hl\">AI-native PDF extension format</span>. A <span class=\"hl\">.ai.pdf</span> is a fully valid PDF — it renders, prints, and opens in any reader unchanged — that also embeds a Brotli-compressed semantic XML layer, so AI parsers read structure directly. <span class=\"hl\">One file. Two audiences. Zero compromise.</span></p>\n        <div class=\"brule\">────────────────────────────────────────────────────────────</div>\n        <div class=\"btags\">\n          <span class=\"tag\"><b>fmt</b> aipdf v1.0</span>\n          <span class=\"tag\"><b>lic</b> Apache-2.0</span>\n          <span class=\"tag\"><b>sdk</b> rust · py · ts</span>\n          <span class=\"tag\"><b>os</b> linux · macos · win</span>\n          <span class=\"tag\"><b>cap</b> 16 MiB</span>\n        </div>\n      </div>\n    </div>\n\n    <!-- 10 · install -->\n    <div class=\"grp\" id=\"g-install\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"curl -fsSL \"></span><span class=\"arg\">.../install.sh</span> <span class=\"dm\">| sh</span></div>\n      <div class=\"install\">\n        <span class=\"lead\">$</span>\n        <span class=\"cmdtext\" id=\"installCmd\">curl -fsSL https://raw.githubusercontent.com/tanmaysheoran/ai.pdf/main/install.sh <span class=\"dm\">| sh</span></span>\n        <button class=\"copy\" id=\"copyInstall\" aria-label=\"Copy install command\">\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>\n          <span id=\"copyLabel\">copy</span>\n        </button>\n      </div>\n      <div class=\"frow\" style=\"margin-top:10px\"><span class=\"fl mg\">windows</span><span class=\"fd\">irm https://raw.githubusercontent.com/tanmaysheoran/ai.pdf/main/install.ps1 | iex</span></div>\n      <div class=\"frow\"><span class=\"fl mg\">cargo</span><span class=\"fd\">cargo install --path crates/aipdf-cli</span></div>\n      <div class=\"frow\"><span class=\"fl mg\">source</span><span class=\"fd\">git clone … &amp;&amp; cd ai.pdf &amp;&amp; ./install.sh</span></div>\n      <div class=\"out\" style=\"margin-top:8px\">  <span class=\"ok\">✓</span> then <span class=\"cy\">aipdf --help</span> <span class=\"dm\">· installs to ~/.cargo/bin</span></div>\n    </div>\n\n    <!-- 01 · what -->\n    <div class=\"grp\" id=\"g-what\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf --what-is-this\"></span></div>\n      <div class=\"out\">  PDF is the dominant format for structured documents — papers, contracts,</div>\n      <div class=\"out\">  reports, forms — but it was designed for <span class=\"fg\">print fidelity, not parsing</span>.</div>\n      <div class=\"out\">  Today AI either runs <span class=\"warn\">OCR on pixels</span> or <span class=\"warn\">brittle text extraction</span>; both</div>\n      <div class=\"out\">  lose tables, reading order, and structure.</div>\n      <div class=\"out\" style=\"margin-top:8px\">  <span class=\"ok\">→</span> <span class=\"fg\">.ai.pdf</span> makes the semantic layer a first-class citizen of the file.</div>\n      <div class=\"note\">\n        <span class=\"nt\">! core rule</span>\n        <span class=\"nb\">PDF is the <span class=\"fg\">visual authority</span>. XML is the <span class=\"fg\">machine-structure authority</span>. Nothing is duplicated.</span>\n      </div>\n    </div>\n\n    <!-- 02 · build -->\n    <div class=\"grp\" id=\"g-build\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf build paper.md \"></span><span class=\"flag\">--render full</span></div>\n      <div class=\"out\">  <span class=\"dm\">›</span> parsing markdown <span class=\"dm\">(pulldown-cmark)</span></div>\n      <div class=\"out\">  <span class=\"dm\">›</span> layout engine → <span class=\"fg\">per-block page + bbox</span></div>\n      <div class=\"out\">  <span class=\"dm\">›</span> compressing semantic XML <span class=\"dm\">(brotli)</span></div>\n      <div class=\"out\">  <span class=\"dm\">›</span> embedding CID/Type0 Unicode font <span class=\"dm\">(DejaVuSans)</span></div>\n      <div class=\"bar-prog\">\n        <div class=\"bar-track\"><div class=\"bar-fill\"></div></div>\n        <span class=\"bar-pct\">100%</span>\n      </div>\n      <div class=\"out\"><span class=\"ok\">  ✓ built</span> <span class=\"fg\">paper.ai.pdf</span> <span class=\"dm\">— opens in any reader</span></div>\n      <div class=\"chips\">\n        <span class=\"chip\"><span class=\"dotg\"></span> render <b>minimal · full · browser</b></span>\n        <span class=\"chip\">page <b>letter · a4</b></span>\n      </div>\n      <div class=\"out\" style=\"margin-top:10px\"><span class=\"dm\">  more:</span></div>\n      <div class=\"out indent dm\">aipdf build page.html <span class=\"cy\">--render browser</span>   <span class=\"cmt\"># full CSS via headless Chrome</span></div>\n      <div class=\"out indent dm\">aipdf build paper.md <span class=\"cy\">--font NotoSansCJK.ttf</span>  <span class=\"cmt\"># embed a CJK font</span></div>\n      <div class=\"out indent dm\">aipdf ingest scanned.pdf            <span class=\"cmt\"># attach a layer (tesseract OCR)</span></div>\n    </div>\n\n    <!-- 03 · inspect -->\n    <div class=\"grp\" id=\"g-inspect\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf inspect paper.ai.pdf\"></span></div>\n      <div class=\"out tree\">\n        <div><span class=\"fg\">paper.ai.pdf</span> <span class=\"dm\">— a standard PDF with an invisible second layer</span></div>\n        <div><span class=\"br\">├─</span> <span class=\"node\">/Pages</span> <span class=\"br\">····</span> <span class=\"desc\">visual layer · page tree + content streams · renders anywhere</span></div>\n        <div><span class=\"br\">├─</span> <span class=\"node\">/AF</span> <span class=\"br\">·······</span> <span class=\"desc\">aipdf-semantic.xml.br · brotli XML, validated vs the V1 schema</span></div>\n        <div><span class=\"br\">└─</span> <span class=\"node\">/Metadata</span> <span class=\"br\">·</span> <span class=\"desc\">XMP packet · discovery, indexing</span></div>\n      </div>\n      <div class=\"out\" style=\"margin-top:8px\">  <span class=\"dm\">detection:</span> byte-scan <span class=\"cy\">/Subtype /application#2Faipdf+xml+br</span></div>\n      <div class=\"out indent dm\">→ structural <span class=\"cy\">lopdf</span> <span class=\"cy\">/EF</span> fallback makes third-party re-saved PDFs detectable</div>\n      <div class=\"out\" style=\"margin-top:6px\">  <span class=\"ok\">→</span> legacy readers ignore the associated file entirely.</div>\n    </div>\n\n    <!-- 04 · formats -->\n    <div class=\"grp\" id=\"g-formats\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf --formats\"></span></div>\n      <div class=\"subhead\">in · any source → semantic XML, automatically</div>\n      <div class=\"frow\"><span class=\"fl\">.xml</span><span class=\"fd\">direct semantic XML — must conform to the V1 schema</span></div>\n      <div class=\"frow\"><span class=\"fl\">.html</span><span class=\"fd\">HTML5 — headings, tables, lists, code, figures extracted</span></div>\n      <div class=\"frow\"><span class=\"fl\">.md</span><span class=\"fd\">Markdown via <b>pulldown-cmark</b> — GFM tables, fenced code, images</span></div>\n      <div class=\"frow\"><span class=\"fl\">.typ</span><span class=\"fd\">Typst — headings, lists, <span class=\"cy\">$…$</span> equations, <span class=\"cy\">image()</span> figures</span></div>\n      <div class=\"frow\"><span class=\"fl\">.pdf</span><span class=\"fd\"><b>aipdf ingest</b> — text extraction + optional <b>tesseract</b> OCR fallback</span></div>\n      <div class=\"subhead\">out · export the semantic payload</div>\n      <div class=\"frow\"><span class=\"fl amb\">--format xml</span><span class=\"fd\">raw semantic payload</span></div>\n      <div class=\"frow\"><span class=\"fl amb\">--format markdown</span><span class=\"fd\">human-readable rendering</span></div>\n      <div class=\"frow\"><span class=\"fl amb\">--format markdown-ast</span><span class=\"fd\">MDAST-compatible JSON tree</span></div>\n      <div class=\"frow\"><span class=\"fl amb\">--format onto</span><span class=\"fd\"><b>token-efficient LLM ingestion</b></span></div>\n      <div class=\"note\">\n        <span class=\"nt\">▣ ONTO</span>\n        <span class=\"nb\">columnar format — cells <span class=\"fg\">^</span>-separated, rows <span class=\"fg\">|</span>-separated. Built byte-identically by all three SDKs (verified by shared golden fixtures).</span>\n      </div>\n    </div>\n\n    <!-- 05 · why -->\n    <div class=\"grp\" id=\"g-why\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf why \"></span><span class=\"flag\">--vs-status-quo</span></div>\n      <div class=\"out cmt\" style=\"margin-bottom:6px\">  // what AI sees today vs. what .ai.pdf hands it</div>\n      <div class=\"diff\">\n        <div class=\"hdr\"><span class=\"err\">— legacy extraction / OCR</span> <span class=\"dm\">→</span> <span class=\"ok\">+ .ai.pdf semantic layer</span></div>\n        <div class=\"row del\"><span class=\"sign\">−</span>\"Rev. 2024 12.4 8.1 … Q3 Q4\"  (columns interleaved)</div>\n        <div class=\"row del\"><span class=\"sign\">−</span>tables flattened · reading order guessed · math dropped</div>\n        <div class=\"row add\"><span class=\"sign\">+</span>&lt;table&gt;&lt;thead&gt;&lt;row&gt;&lt;cell header=\"true\"&gt;Method&lt;/cell&gt;…  typed cells</div>\n        <div class=\"row add\"><span class=\"sign\">+</span>&lt;equation&gt; MathML &lt;/equation&gt; · &lt;citation/&gt; · exact reading order</div>\n      </div>\n      <div class=\"out\" style=\"margin-top:8px\">  <span class=\"dm\">blocks:</span> <span class=\"fg\">paragraph · title · codeBlock · equation · table · figure · list</span></div>\n      <div class=\"out indent dm\">definitionList · note · footnote · annotation · citation · reference</div>\n      <div class=\"out indent dm\">each carries <span class=\"cy\">id</span> · <span class=\"cy\">page</span> · <span class=\"cy\">bbox</span> · <span class=\"cy\">role</span></div>\n    </div>\n\n    <!-- 06 · sdk -->\n    <div class=\"grp\" id=\"g-sdk\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf sdk \"></span><span class=\"flag\">--example</span></div>\n      <div class=\"out\" style=\"margin-bottom:6px\">  read-side transforms are <span class=\"gr\">byte-identical</span> across all three <span class=\"dm\">(golden fixtures);</span></div>\n      <div class=\"out\" style=\"margin-bottom:6px\"><span class=\"dm\">  write-side (build · ingest) delegates to the Rust core.</span></div>\n      <div class=\"sdk\" id=\"sdk\">\n        <div class=\"sdk-tabs\" role=\"tablist\">\n          <button class=\"sdk-tab on\" data-s=\"py\"><span class=\"glyph\">●</span> python</button>\n          <button class=\"sdk-tab\" data-s=\"rs\"><span class=\"glyph\">●</span> rust</button>\n          <button class=\"sdk-tab\" data-s=\"ts\"><span class=\"glyph\">●</span> typescript</button>\n        </div>\n        <div class=\"sdk-pane on\" data-s=\"py\"><span class=\"c\"># pip install -e sdk/python   ·   dep: brotli &gt;= 1.1.0</span>\n<span class=\"k\">from</span> aipdf <span class=\"k\">import</span> AIPDF\n\ndoc = AIPDF.open(<span class=\"s\">\"paper.ai.pdf\"</span>)\n<span class=\"f\">print</span>(doc.to_markdown())\n<span class=\"f\">print</span>(doc.to_onto())\n\n<span class=\"k\">for</span> block <span class=\"k\">in</span> doc.get_reading_order():\n    <span class=\"f\">print</span>(<span class=\"s\">f\"[{block.kind}] page={block.page}  {block.text[:60]}\"</span>)</div>\n        <div class=\"sdk-pane\" data-s=\"rs\"><span class=\"c\">// aipdf = { path = \"crates/aipdf\" }</span>\n<span class=\"k\">use</span> aipdf::AipdfDocument;\n\n<span class=\"k\">let</span> doc = AipdfDocument::open(<span class=\"s\">\"paper.ai.pdf\"</span>)?;\n<span class=\"f\">println!</span>(<span class=\"s\">\"{}\"</span>, doc.to_markdown()?);\n<span class=\"f\">println!</span>(<span class=\"s\">\"{}\"</span>, doc.to_onto()?);\n\n<span class=\"k\">for</span> block <span class=\"k\">in</span> doc.get_reading_order()? {\n    <span class=\"f\">println!</span>(<span class=\"s\">\"[{}] page={:?} {}\"</span>, block.kind, block.page, block.text);\n}</div>\n        <div class=\"sdk-pane\" data-s=\"ts\"><span class=\"c\">// cd sdk/typescript &amp;&amp; npm install &amp;&amp; npm run build</span>\n<span class=\"k\">import</span> { AIPDF } <span class=\"k\">from</span> <span class=\"s\">\"./src/index.js\"</span>;\n\n<span class=\"k\">const</span> doc = AIPDF.open(<span class=\"s\">\"paper.ai.pdf\"</span>);\n<span class=\"f\">console</span>.log(doc.toMarkdown());\n<span class=\"f\">console</span>.log(doc.toOnto());\n\n<span class=\"k\">for</span> (<span class=\"k\">const</span> block <span class=\"k\">of</span> doc.getReadingOrder())\n  <span class=\"f\">console</span>.log(<span class=\"s\">`[${block.kind}] page=${block.page}`</span>);</div>\n      </div>\n    </div>\n\n    <!-- 07 · mcp -->\n    <div class=\"grp\" id=\"g-mcp\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf-mcp\"></span>  <span class=\"cmt\"># or: python -m aipdf.mcp_server</span></div>\n      <div class=\"out\">  <span class=\"ok\">●</span> MCP stdio server up — <span class=\"fg\">drop ai.pdf into any agent</span>.</div>\n      <div class=\"out\" style=\"margin-top:8px\"><span class=\"dm\">  tools exposed:</span></div>\n      <div class=\"chips\">\n        <span class=\"chip\"><span class=\"mg\">aipdf_inspect</span></span>\n        <span class=\"chip\"><span class=\"mg\">aipdf_extract</span></span>\n        <span class=\"chip\"><span class=\"mg\">aipdf_reading_order</span></span>\n        <span class=\"chip\"><span class=\"mg\">aipdf_validate</span></span>\n        <span class=\"chip\"><span class=\"mg\">aipdf_build</span></span>\n        <span class=\"chip\"><span class=\"mg\">aipdf_convert</span></span>\n      </div>\n      <div class=\"out\" style=\"margin-top:8px\">  <span class=\"dm\">→ client config in</span> <span class=\"cy\">docs/mcp.md</span></div>\n    </div>\n\n    <!-- 08 · security -->\n    <div class=\"grp\" id=\"g-security\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf validate paper.ai.pdf \"></span><span class=\"flag\">--security</span></div>\n      <div class=\"out\">  the semantic layer is <span class=\"fg\">data, not behavior</span>.</div>\n      <div class=\"out\" style=\"margin-top:6px\"><span class=\"ok\">  ✓</span> <span class=\"cy\">sanitize_xml</span> on every build + extract — identical rejected-marker list across rust/py/ts</div>\n      <div class=\"out\"><span class=\"err\">  ✗ rejected markers</span> <span class=\"dm\">(active-content / structural only):</span></div>\n      <div class=\"out indent\"><span class=\"err\">&lt;!DOCTYPE</span>  <span class=\"err\">&lt;?xml-stylesheet</span>  <span class=\"err\">&lt;?processing</span>  <span class=\"err\">&lt;script</span>  <span class=\"err\">/JavaScript</span>  <span class=\"err\">/Launch</span></div>\n      <div class=\"out\"><span class=\"ok\">  ✓</span> no external entity resolution · <span class=\"warn\">decompressed payload capped at 16 MiB</span></div>\n      <div class=\"out\"><span class=\"ok\">  ✓</span> no embeddings, prompts, model output, or executable content in V1</div>\n      <div class=\"out\" style=\"margin-top:6px\">  <span class=\"dm\">natural-language phrases are</span> <span class=\"fg\">not</span> <span class=\"dm\">banned — XML text is data; the visible PDF carries the same words.</span></div>\n    </div>\n\n    <!-- 09 · status -->\n    <div class=\"grp\" id=\"g-status\">\n      <div class=\"cmd\"><span class=\"pr\">❯</span> <span class=\"cwd\">~/research</span> <span class=\"typed\" data-type=\"aipdf --status\"></span></div>\n      <div class=\"out\">  <span class=\"fg\">V1 prototype</span> — format spec, schema, and all three SDKs functional + tested.</div>\n      <div class=\"cols2\" style=\"margin-top:10px\">\n        <div>\n          <div class=\"subhead\" style=\"color:var(--green)\">working today</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> author from XML · HTML · Markdown · Typst</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> <span class=\"fg\">full</span> render · layout engine + embedded font</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> per-block page + bbox written back</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> ingest existing PDFs (text + OCR)</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> 1.x version negotiation</div>\n          <div class=\"out\"><span class=\"ok\">✓</span> MCP server · byte-identical ONTO/MD/AST</div>\n        </div>\n        <div>\n          <div class=\"subhead\" style=\"color:var(--amber)\">not yet</div>\n          <div class=\"out\"><span class=\"warn\">○</span> rasterize vector pages for OCR</div>\n          <div class=\"out\"><span class=\"warn\">○</span> glyph subsetting for embedded fonts</div>\n          <div class=\"out\"><span class=\"warn\">○</span> signed payloads</div>\n          <div class=\"out\"><span class=\"warn\">○</span> incremental-update authoring</div>\n          <div class=\"out\"><span class=\"warn\">○</span> PDF 2.0 conformance suite</div>\n        </div>\n      </div>\n    </div>\n\n    <!-- 11 · live prompt -->\n    <div class=\"grp\" id=\"g-try\">\n      <div class=\"out cmt\">  // your turn — this prompt is live. try a command.</div>\n      <div id=\"liveout\"></div>\n      <form class=\"repl\" id=\"repl\" autocomplete=\"off\">\n        <span class=\"pr\">❯</span><span class=\"cwd\">~/research</span>\n        <input class=\"repl-input\" id=\"replInput\" type=\"text\" spellcheck=\"false\" placeholder=\"type `help` and press enter…\" aria-label=\"Terminal input\">\n      </form>\n      <div class=\"hintline\">\n        commands: <b>help</b> <b>what</b> <b>build</b> <b>inspect</b> <b>formats</b> <b>why</b> <b>sdk</b> <b>mcp</b> <b>security</b> <b>status</b> <b>install</b> <b>theme</b> <b>clear</b>\n        &nbsp;·&nbsp; <span class=\"kbd\">↑</span><span class=\"kbd\">↓</span> history\n      </div>\n    </div>\n\n  </div>\n\n  <!-- ── status bar ────────────────────────────────────────────── -->\n  <footer class=\"statusbar\">\n    <span class=\"seg mode\"><span class=\"dotp\"></span> LIVE</span>\n    <span class=\"seg\"><b>landing.ai.pdf</b></span>\n    <span class=\"seg hideSm\">utf-8</span>\n    <span class=\"seg hideSm\">aipdf 1.0 · Apache-2.0</span>\n    <span class=\"grow\"></span>\n    <span class=\"seg hideSm\">type <b>help</b> ↵</span>\n    <span class=\"seg\" id=\"posSeg\">Ln 1, Col 1</span>\n    <span class=\"seg\" id=\"clockSeg\">--:--:--</span>\n    <span class=\"seg right\">\n      <span class=\"swatches\" id=\"swatches\" title=\"theme\">\n        <button class=\"sw graphite\" data-theme=\"graphite\" aria-label=\"Graphite theme\"></button>\n        <button class=\"sw amber\" data-theme=\"amber\" aria-label=\"Amber theme\"></button>\n        <button class=\"sw light on\" data-theme=\"light\" aria-label=\"Light theme\"></button>\n      </span>\n    </span>\n  </footer>\n\n</main>\n\n<script src=\"44797c12-905f-4f59-bb85-3ac3fdebb46c\"><\/script>\n\n\n</body></html>"
