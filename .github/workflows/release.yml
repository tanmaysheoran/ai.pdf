name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: aipdf-x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: aipdf-aarch64-linux.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: aipdf-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: aipdf-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: aipdf-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build -p aipdf-cli --release --target ${{ matrix.target }}
          else
            cargo build -p aipdf-cli --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "${{ matrix.artifact }}" -C target/${{ matrix.target }}/release aipdf

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/aipdf.exe -DestinationPath ${{ matrix.artifact }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
